<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to My Website</title>
<style>
  body {
    background-color: lightblue;
    font-family: Cambria, "Cambria Math", serif;
    font-size: 14px;
    text-align: center;
    margin: 0;
    padding: 30px 20px;
    color: #003366;
  }

  h1 {
    font-family: Cambria, serif;
    color: #003366;
    margin-bottom: 10px;
  }

  /* Scrolling text using CSS animation (no <marquee> tag) */
  .scroll-container {
    width: 80%;
    max-width: 700px;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    background-color: #ffffff;
    border: 2px solid #4a90d9;
    border-radius: 6px;
    margin: 20px auto;
    padding: 10px 0;
  }

  .scroll-text {
    display: inline-block;
    padding-left: 100%;
    font-size: 14px;
    color: #1a5fb4;
    animation: scroll-left 12s linear infinite;
  }

  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* Grid box layout */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 80%;
    max-width: 700px;
    margin: 30px auto;
  }

  .grid-box {
    background-color: #cfe8ff;
    border: 2px solid #4a90d9;
    border-radius: 8px;
    padding: 20px 10px;
    color: #003366;
    font-size: 14px;
  }

  /* Blue button with white text */
  .my-button {
    background-color: #1a5fb4;
    color: white;
    font-family: Cambria, serif;
    font-size: 14px;
    border: none;
    padding: 12px 28px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 20px;
  }

  .my-button:hover {
    background-color: #144a8f;
  }

  img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <h1>Welcome to My Website</h1>
  <p>This is a simple page built with HTML and CSS, centered on the screen with a light blue theme.</p>

  <!-- Scrolling text -->
  <div class="scroll-container">
    <span class="scroll-text">Welcome to my website — thanks for visiting! Scroll down to see more content below.</span>
  </div>

  <!-- Grid box layout -->
  <div class="grid-container">
    <div class="grid-box">Box 1</div>
    <div class="grid-box">Box 2</div>
    <div class="grid-box">Box 3</div>
    <div class="grid-box">Box 4</div>
    <div class="grid-box">Box 5</div>
    <div class="grid-box">Box 6</div>
  </div>

  <!-- Button -->
  <button class="my-button">Click Me</button>

</body>
</html>
